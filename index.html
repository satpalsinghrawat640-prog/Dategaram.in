M().innerHTML=`<section class="ph">${av(u,'big')}<div><h2>${esc(u.name)}${badge(u)}</h2><small>@${esc(u.un)}${u.showAge?' · '+age(u.dob):''}${u.city?' · '+esc(u.city):''}</small></div>${mine?`<button data-a="menu">${ic('menu')}</button>`:''}</section><div class="pf"><p>${esc(u.bio)}</p><p><b>${n1.data().count}</b> followers · <b>${n2.data().count}</b> following</p>${mine?'<button class="btn" data-a="edit">✏️ Edit Profile</button>':`<button class="btn" id="fb">${f.exists()?'Following':'Follow'}</button>`}</div><div id="pp"></div>`;
if(!mine)$('#fb').onclick=async()=>{try{await(f.exists()?deleteDoc(f.ref):setDoc(f.ref,{from:me.uid,to:id,status:'accepted',t:Date.now()}));profile(id)}catch(e){toast(e.message)}};
pg.push(onSnapshot(query(collection(db,'posts'),where('uid','==',id)),s=>{const ps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(a.id<b.id?-1:1));$('#pp').innerHTML=ps.map(card).join('')||'<p class="mt">No posts yet.</p>'},e=>toast(e.message)))}catch(e){toast(e.message)}}
async function disc(){M().innerHTML='<div class="sbar"><input id="q" placeholder="Search"></div><div id="dk" class="pcards"></div>';let all=[],ls=[],fl=new Set,st=new Set;
try{all=(await getDocs(query(collection(db,'users'),limit(100)))).docs.map(d=>d.data()).filter(u=>u.uid!=me.uid&&!u.banned);
fl=new Set((await getDocs(query(collection(db,'follows'),where('from','==',me.uid)))).docs.map(d=>d.data().to));
st=new Set((await getDocs(query(collection(db,'stars'),where('uid','==',me.uid)))).docs.map(d=>d.data().target))}catch(e){toast(e.message)}
const paint=()=>{const d=$('#dk');d.innerHTML=ls.map(u=>`<div class="pc" data-uid="${u.uid}"><div data-u="${u.uid}">${img(u.av)?`<img class="im" src="${img(u.av)}" alt="">`:`<div class="im">${esc((u.name||'?')[0])}</div>`}<b>${esc(u.name)}${badge(u)}</b><small>${u.showAge?age(u.dob)+(u.city?' · ':''):''}${esc(u.city)}</small></div><div class="row"><button class="sm ${fl.has(u.uid)?'o':''}" data-f="${u.uid}">${fl.has(u.uid)?'Following':'Follow'}</button><button class="sm o" data-s="${u.uid}">${st.has(u.uid)?'★':'☆'}</button></div></div>`).join('')||'<p class="mt">No profiles found.</p>'};
$('#q').oninput=e=>{const k=e.target.value.trim().toLowerCase();ls=all.filter(u=>!k||u.un.includes(k)||(u.name||'').toLowerCase().includes(k));paint()};ls=all;paint();
$('#dk').onclick=async e=>{const f=e.target.closest('[data-f]'),t=e.target.closest('[data-s]');try{
if(f){const id=f.dataset.f,r=doc(db,'follows',me.uid+'_'+id);if(fl.has(id)){await deleteDoc(r);fl.delete(id)}else{await setDoc(r,{from:me.uid,to:id,status:'accepted',t:Date.now()});fl.add(id)}paint()}
else if(t){const id=t.dataset.s,r=doc(db,'stars',me.uid+'_'+id);if(st.has(id)){await deleteDoc(r);st.delete(id)}else{await setDoc(r,{uid:me.uid,target:id,t:Date.now()});st.add(id)}paint()}}catch(x){toast(x.message)}}}

let SB={};
async function loadStories(box){try{const q=await getDocs(query(collection(db,'stories'),limit(60)));const now=Date.now();SB={};q.docs.forEach(d=>{const x=d.data(),it=(x.items||[]).filter(i=>i.exp>now);if(it.length)SB[d.id]=it});
const seen=JSON.parse(localStorage.seen||'{}'),ids=Object.keys(SB).filter(i=>i!=me.uid);await Promise.all(ids.map(user));
const mine=SB[me.uid];
box.innerHTML=`<button data-st="${me.uid}" data-add="1"><span class="ring add ${mine?'new':''}">${av(P)}<span class="pl" data-newst="1">+</span></span>Your story</button>`+ids.map(i=>{const last=SB[i][SB[i].length-1].t,nw=(seen[i]||0)<last;return`<button data-st="${i}"><span class="ring ${nw?'new':''}">${av(U[i])}</span>${esc((U[i].un||'').slice(0,9))}</button>`}).join('')}catch(e){box.innerHTML=''}}
function addStory(){let im='';const s=sheet('<h3>New story</h3><label class="pick"><img id="pv" class="pimg" hidden alt=""><span id="pt">📷 Choose a photo</span><input id="f" type="file" accept="image/*"></label><input id="cap" maxlength="100" placeholder="Caption"><button class="btn" id="sh" disabled>Share story</button>'),q=x=>s.querySelector(x);
q('#f').onchange=async e=>{try{im=await shrink(e.target.files[0],720);q('#pv').src=im;q('#pv').hidden=false;q('#pt').hidden=true;q('#sh').disabled=false}catch{toast('Could not read that image')}};
q('#sh').onclick=async()=>{q('#sh').disabled=true;try{const r=doc(db,'stories',me.uid),old=(await getDoc(r)).data()?.items||[],now=Date.now(),h=(P.plan>=2&&P.planUntil>now)?48:24;
const items=[...old.filter(i=>i.exp>now),{img:im,cap:q('#cap').value.trim(),t:now,exp:now+h*3600000}].slice(-5);await setDoc(r,{uid:me.uid,items});s.remove();go('home')}catch(e){toast(e.message);q('#sh').disabled=false}}}
function viewStory(id){const items=SB[id];if(!items)return;let i=0,tm;const v=document.createElement('div');v.id='sv';document.body.append(v);
const close=()=>{clearTimeout(tm);v.remove()};
const show=()=>{if(i>=items.length)return close();if(i<0)i=0;const it=items[i];const u=U[id]||P;
v.innerHTML=`<div class="bars">${items.map((_,k)=>`<i><b style="width:${k<i?100:0}%"></b></i>`).join('')}</div><div class="hd">${av(u)}<b>${esc(u.un)}</b><span class="sp"></span>${id==me.uid?'<button id="sd">🗑</button>':''}<button id="sx">✕</button></div><img src="${img(it.img)}" alt=""><div class="cp">${esc(it.cap)}</div><div class="zl"></div><div class="zr"></div>`;
const bar=v.querySelectorAll('.bars b')[i];bar.style.transition='width 5s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%'));
const sn=JSON.parse(localStorage.seen||'{}');sn[id]=it.t;localStorage.seen=JSON.stringify(sn);
clearTimeout(tm);tm=setTimeout(()=>{i++;show()},5000);
v.querySelector('.zr').onclick=()=>{i++;show()};v.querySelector('.zl').onclick=()=>{i--;show()};v.querySelector('#sx').onclick=()=>{close();go('home')};
const d=v.querySelector('#sd');if(d)d.onclick=async()=>{if(!confirm('Delete this story?'))return;try{const left=items.filter((_,k)=>k!=i);await setDoc(doc(db,'stories',me.uid),{uid:me.uid,items:left});close();go('home')}catch(e){toast(e.message)}}};show()}
function newPost(){let im='';const s=sheet('<h3>New post</h3><label class="pick"><img id="pv" class="pimg" hidden alt=""><span id="pt">📷 Choose a photo</span><input id="f" type="file" accept="image/*"></label><textarea id="cap" maxlength="500" placeholder="Write a caption"></textarea><button class="btn" id="sh" disabled>Share</button>'),q=x=>s.querySelector(x);
q('#f').onchange=async e=>{try{im=await shrink(e.target.files[0],720);q('#pv').src=im;q('#pv').hidden=false;q('#pt').hidden=true;q('#sh').disabled=false}catch{toast('Could not read that image')}};
q('#sh').onclick=async()=>{q('#sh').disabled=true;try{await setDoc(doc(db,'posts',pid()),{uid:me.uid,img:im,cap:q('#cap').value.trim(),t:Date.now(),pinned:false});s.remove();go('home')}catch(e){toast(e.message);q('#sh').disabled=false}}}
async function like(id,pu){const r=doc(db,'likes',id+'_'+me.uid);try{L.has(id)?await deleteDoc(r):await setDoc(r,{postId:id,postUid:pu,uid:me.uid,t:Date.now()})}catch(e){toast(e.message)}}
function comments(id,pu){const s=sheet('<h3>Comments</h3><div class="l"></div><div class="row"><input id="ci" maxlength="300" placeholder="Add a comment"><button class="btn" id="cs">Post</button></div>'),l=s.querySelector('.l');
s.cl.push(onSnapshot(query(collection(db,'comments'),where('postId','==',id)),async q=>{const cs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);await Promise.all(cs.map(c=>user(c.uid)));l.innerHTML=cs.map(c=>`<p><span><b>${esc(U[c.uid].un)}</b> ${esc(c.txt)}</span><span class="sp"></span>${c.uid==me.uid||pu==me.uid?`<a data-cd="${c.id}">delete</a>`:''}</p>`).join('')||'<p class="mt">No comments yet.</p>'},e=>toast(e.message)));
l.onclick=async e=>{const c=e.target.dataset.cd;if(c)try{await deleteDoc(doc(db,'comments',c))}catch(x){toast(x.message)}};
s.querySelector('#cs').onclick=async()=>{const i=s.querySelector('#ci'),t=i.value.trim();if(!t)return;try{await setDoc(doc(collection(db,'comments')),{postId:id,postUid:pu,uid:me.uid,txt:t,t:Date.now()});i.value=''}catch(e){toast(e.message)}}}
async function likedBy(id){const s=sheet('<h3>Liked by</h3><div class="l"><p class="mt">Loading…</p></div>');try{const q=await getDocs(query(collection(db,'likes'),where('postId','==',id),where('postUid','==',me.uid)));const us=await Promise.all(q.docs.map(d=>user(d.data().uid)));s.querySelector('.l').innerHTML=us.map(u=>`<p data-u="${u.uid}">${av(u)}<b>${esc(u.un)}</b>${badge(u)}</p>`).join('')||'<p class="mt">No likes yet.</p>'}catch(e){toast(e.message)}}
function edit(){let a=P.av;const s=sheet(`<h3>Edit Profile</h3><label class="pick"><span class="av big" id="pv">${img(a)?`<img src="${img(a)}">`:'+'}</span>Change photo<input id="f" type="file" accept="image/*"></label><input id="n" value="${esc(P.name)}" maxlength="40"><input id="un" value="${esc(P.un)}" maxlength="30" autocapitalize="none"><input id="ci" value="${esc(P.city)}" maxlength="80" placeholder="City"><textarea id="bio" maxlength="150" placeholder="Bio">${esc(P.bio)}</textarea><label><input type="checkbox" id="sa" ${P.showAge?'checked':''}>Show age</label><small>Date of birth cannot be changed.</small><div class="tk"><button class="bl" id="eb">${TICK} Blue Tick</button><button class="gr" id="eg">${GTICK} Free Green Tick</button></div><button class="btn" id="sv">Save</button>`),q=x=>s.querySelector(x);
q('#f').onchange=async e=>{try{a=await shrink(e.target.files[0],256);q('#pv').innerHTML=`<img src="${a}">`}catch{toast('Could not read that image')}};
q('#eb').onclick=plans;q('#eg').onclick=greenTick;
q('#sv').onclick=async()=>{const un=q('#un').value.trim().toLowerCase();if(!UN.test(un))return toast('Invalid username');const d={name:q('#n').value.trim()||P.name,un,city:q('#ci').value.trim(),bio:q('#bio').value.trim(),showAge:q('#sa').checked,av:a};
try{await runTransaction(db,async t=>{if(un!=P.un){const r=doc(db,'usernames',un);if((await t.get(r)).exists())throw Error('Username is taken');t.set(r,{uid:me.uid});t.delete(doc(db,'usernames',P.un))}t.update(doc(db,'users',me.uid),d)});Object.assign(P,d);$('nav [data-go=me]').innerHTML=av(P);s.remove();go('prof',me.uid)}catch(e){toast(e.message)}}}
function plans(){sheet(`<h3>Plans and Blue Tick</h3><div class="pl2"><b>${TICK} Blue Tick - Rs 19 / 1 year</b><p><small>Blue Tick badge next to your name everywhere.</small></p><button class="btn" data-pay="1">Choose plan</button></div><div class="pl2"><b>${TICK} Pro - Rs 50 / 1 year</b><p><small>Blue Tick, custom profile colour, 48-hour stories and profile song.</small></p><button class="btn" data-pay="2">Choose plan</button></div><small>Approval is manual and may take some time.</small>`).onclick=e=>{if(e.target.dataset.pay)toast('Payments open in the next update')}}
function greenTick(){sheet(`<h3>${GTICK} Free Green Tick</h3><p>Verify your profile with a live selfie. Keep your face clear and well lit. We never ask for any ID card.</p><button class="btn" id="gt">Start verification</button>`).querySelector('#gt').onclick=()=>toast('Verification opens in the next update')}
function support(){const S=SUPP;sheet(`<h3>Support</h3><p><small>We are here to help. Tap a button to reach us.</small></p><a class="sup" href="${S.tg}" target="_blank" rel="noopener">${TG}Telegram</a><a class="sup" href="${S.ch}" target="_blank" rel="noopener">${TG}Telegram Channel</a><a class="sup" href="${S.gp}" target="_blank" rel="noopener">${TG}Telegram Group</a>${S.ig?`<a class="sup" href="${esc(S.ig)}" target="_blank" rel="noopener">${IGL}Instagram</a>`:''}<a class="sup" href="mailto:${S.em}">${EML}Email: ${S.em}</a><h3 style="margin-top:16px">Contact support</h3><textarea id="sm" maxlength="500" placeholder="Write your message"></textarea><button class="btn" id="ss">Send message</button>`).querySelector('#ss').onclick=async function(){const sh=this.closest('.box'),t=sh.querySelector('#sm').value.trim();if(!t)return;try{await setDoc(doc(db,'support',pid()),{uid:me.uid,un:P.un,txt:t,t:Date.now()});sh.querySelector('#sm').value='';toast('Message sent. We will reply soon.')}catch(e){toast(e.message)}}}
function menu(){const it=[['⚙️','Settings','Dark mode and account','set'],['🔖','Saved','Posts you saved','x'],['⭐','Close Friends','Your private star list','x'],['💎','Plans and Blue Tick','Get your badge','plans'],['✅','Free Green Tick','Verify with a selfie','green'],['🚫','Blocked accounts','People you blocked','x'],['💬','Support','Chat, email and help','sup'],['📄','Terms and Privacy','Rules of Dategram','tp'],...(me.email==ADMIN&&me.emailVerified?[['🛡️','Admin Panel','Owner tools','x']]:[]),['🚪','Log out','Sign out of this account','out','red']];
const s=sheet('<h3>Menu</h3>'+it.map(x=>`<button class="mi ${x[4]||''}" data-m="${x[3]}"><span class="mx">${x[0]}</span><span class="mt2">${x[1]}<small>${x[2]}</small></span><span class="ar">›</span></button>`).join(''));
s.onclick=e=>{if(e.target==s||e.target.classList.contains('x'))return s.remove();const bt=e.target.closest('.mi');if(!bt)return;const m=bt.dataset.m;
if(m=='out'){s.remove();signOut(auth)}else if(m=='tp')sheet(`<h3>Terms and Privacy</h3><p>${esc(TERMS)}</p>`);
else if(m=='plans')plans();else if(m=='green')greenTick();else if(m=='sup')support();
else if(m=='set')sheet(`<h3>Settings</h3><label><input type="checkbox" id="dm" ${document.documentElement.dataset.th=='dark'?'checked':''}>Dark mode</label><p><small>Account deletion arrives in a later update.</small></p>`).querySelector('#dm').onchange=e=>{localStorage.th=e.target.checked?'dark':'light';document.documentElement.dataset.th=localStorage.th};
else soon()}}
document.addEventListener('click',async e=>{if(e.target.dataset.newst)return addStory();const stt=e.target.closest('[data-st]');if(stt){const id=stt.dataset.st;if(stt.dataset.add&&!SB[id])return addStory();if(stt.dataset.add){return viewStory(id)}return viewStory(id)}const t=e.target.closest('[data-go],[data-a],[data-u]');if(!t||t.closest('.sheet')&&!t.dataset.u)return;const d=t.dataset,c=t.closest('.card'),a=d.a;
try{if(d.go){const g=d.go;if(g=='home'||g=='search')go(g);else if(g=='me')go('prof',me.uid);else if(g=='plus')newPost();else soon()}
else if(d.u){closeAll();go('prof',d.u)}
else if(a=='like')like(c.dataset.id,c.dataset.pu);else if(a=='cmt')comments(c.dataset.id,c.dataset.pu);else if(a=='by')likedBy(c.dataset.id);
else if(a=='del'){if(confirm('Delete this post?'))await deleteDoc(doc(db,'posts',c.dataset.id))}
else if(a=='pin')await updateDoc(doc(db,'posts',c.dataset.id),{pinned:c.dataset.pin!='1'});
else if(a=='menu')menu();else if(a=='edit')edit()}catch(x){toast(x.message)}});
onAuthStateChanged(auth,async u=>{pg.forEach(f=>f());gl.forEach(f=>f());pg=[];gl=[];
if(!u){me=null;return login()}me=u;
try{const s=await getDoc(doc(db,'users',u.uid));if(!s.exists())return signup();P=s.data();U[u.uid]=P;if(P.banned)return banned();start()}catch(e){toast(e.message)}});
</script></body></html>
